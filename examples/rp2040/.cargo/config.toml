[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = [
  "probe-rs",
  "run",
  "--chip", "RP2040",
  # https://defmt.ferrous-systems.com/custom-log-output#metadata-specifiers
  "--log-format", "{t:dimmed} {[{L:severity}] - %12}{s:white} \n{└─{m:yellow} @ {fff:cyan}:{l}%dimmed}",
]

rustflags = [
    "-C", "linker=flip-link",
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "no-vectorize-loops",
]

[unstable]
build-std = ["core", "alloc"]

[build]
target = "thumbv6m-none-eabi"    # Cortex-M0 and Cortex-M0+ (e.g. RP2040)

[env]
DEFMT_LOG = "debug"
